          - 'null'
        Type:
          type:
          - string
          - 'null'
        ReportType:
          type:
          - string
          - 'null'
        IsRestated:
          type: boolean
        Value:
          type:
          - string
          - 'null'
        Date:
          type:
          - string
          - 'null'
        LastUpdated:
          type:
          - string
          - 'null'
        Unit:
          type:
          - string
          - 'null'
      additionalProperties: false
    FinancialStatement:
      type: object
      properties:
        StatementType:
