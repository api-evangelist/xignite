            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/FundamentalsSet'
        additionalProperties: false
    Common:
      type: object
      properties:
        Delay:
          type: number
          format: double
        Identity:
          type:
          - string
          - 'null'
        Message:
          type:
          - string
          - 'null'
        Outcome:
