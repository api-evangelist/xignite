components:
  schemas:
    EventSummary:
      type: object
      properties:
        EventType:
          type:
          - string
          - 'null'
        EffectiveDate:
          type:
          - string
          - 'null'
        CompositeIdentifier:
          type:
          - string
          - 'null'
        EventIdentifier:
          type:
          - string
          - 'null'
        EventNotes:
          type:
          - string
          - 'null'
        Created:
          type:
          - string
          - 'null'
        LastUpdated:
          type:
          - string
          - 'null'
      additionalProperties: false
    SecurityEvent:
      type: object
      properties:
        Security:
          allOf:
          - $ref: '#/components/schemas/Security'
        EventSummaries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EventSummary'
      additionalProperties: false
    RightsList:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          Security:
            allOf:
            - $ref: '#/components/schemas/Security'
          SecurityRights:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/Rights'
        additionalProperties: false
    Spinoff:
      type: object
      properties:
        ExDate:
          type:
          - string
          - 'null'
        RecordDate:
          type:
          - string
          - 'null'
        PayDate:
