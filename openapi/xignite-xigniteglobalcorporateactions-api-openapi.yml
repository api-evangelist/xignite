          - 'null'
        WithdrawalRights:
          type:
          - string
          - 'null'
        PayType:
          type:
          - string
          - 'null'
        IsDefaultOption:
          type: boolean
        OptionElectionDate:
          type:
          - string
          - 'null'
        EventIdentifier:
          type:
          - string
          - 'null'
        NumberOfInitialInstruments:
          type:
          - string
          - 'null'
        NumberOfNewInstruments:
          type:
          - string
          - 'null'
        Amount:
          type:
          - string
          - 'null'
        Currency:
          type:
          - string
          - 'null'
        SpunOffRatio:
          type:
          - string
          - 'null'
        DistributedSecurity:
          allOf:
          - $ref: '#/components/schemas/Security'
      additionalProperties: false
    ListingChangeList:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          ListingChanges:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/ListingChange'
        additionalProperties: false
    Rights:
      type: object
      properties:
        ExDate:
          type:
          - string
          - 'null'
        RecordDate:
          type:
          - string
          - 'null'
        PayDate:
          type:
          - string
          - 'null'
        SubscriptionStartDate:
          type:
          - string
          - 'null'
        SubscriptionEndDate:
          type:
          - string
          - 'null'
        TradeStartDate:
          type:
          - string
          - 'null'
        TradeEndDate:
          type:
          - string
          - 'null'
        SplitDate:
          type:
          - string
          - 'null'
        IssuePrice:
          type:
          - string
          - 'null'
        Currency:
          type:
          - string
          - 'null'
        NumberOfInitialInstruments:
