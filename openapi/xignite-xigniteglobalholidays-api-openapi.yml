          UTCOffset:
            type: number
            format: double
        additionalProperties: false
    IntegerResult:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        additionalProperties: false
    FinancialCenter:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          FinancialCenterCode:
            type:
            - string
            - 'null'
          CurrencyCode:
            type:
            - string
            - 'null'
          CountryCode:
            type:
            - string
            - 'null'
          FinancialCenterName:
            type:
            - string
            - 'null'
        additionalProperties: false
    Phase:
      type: object
