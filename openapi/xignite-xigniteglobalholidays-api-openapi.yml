components:
  schemas:
    StringResult:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        additionalProperties: false
    OutcomeTypes:
      enum:
      - Success
      - SystemError
      - RequestError
      - RegistrationError
      type: string
    ExchangePhases:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          Exchange:
            type:
            - string
            - 'null'
          Date:
            type:
            - string
            - 'null'
          UTCOffset:
            type: integer
            format: int32
          IsOpen:
            type: boolean
          Day:
            type:
            - string
            - 'null'
          DayType:
            type:
            - string
            - 'null'
          Phases:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/Phase'
        additionalProperties: false
    Holiday:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          Location:
            type:
            - string
            - 'null'
          Date:
            type:
            - string
            - 'null'
          Name:
            type:
            - string
            - 'null'
          FullHoliday:
            type: boolean
          EarlyClose:
            type: boolean
        additionalProperties: false
    Common:
      type: object
      properties:
        Delay:
          type: number
          format: double
        Identity:
          type:
          - string
          - 'null'
        Message:
          type:
          - string
          - 'null'
        Outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeTypes'
      additionalProperties: false
    ExchangeSchedule:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          Symbol:
            type:
            - string
            - 'null'
          Date:
