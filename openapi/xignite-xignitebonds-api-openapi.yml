                  $ref: '#/components/schemas/PriceComposite'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceComposite'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceComposite'
            text/csv:
              schema:
                type: array
