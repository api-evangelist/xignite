openapi: 3.2.0
info:
  title: Xignite Bonds API
  version: 1.0.3
servers:
- url: https://bonds.xignite.com
security:
- basic: []
tags:
- name: XigniteBonds
paths:
  /xBonds/ListBonds:
    get:
      tags:
      - XigniteBonds
      parameters:
      - name: PriceSource
        in: query
        schema:
          type: string
      - name: BondType
        in: query
        schema:
          type: string
      - name: StartSymbol
        in: query
        schema:
          type: string
      - name: EndSymbol
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBondsResult'
            text/json:
              schema:
                $ref: '#/components/schemas/ListBondsResult'
            application/xml:
              schema:
                $ref: '#/components/schemas/ListBondsResult'
            text/xml:
              schema:
                $ref: '#/components/schemas/ListBondsResult'
            text/csv:
              schema:
                $ref: '#/components/schemas/ListBondsResult'
      summary: Get x bonds list bonds
      x-summary-source: derived
      operationId: getXBondsListBonds
      x-operation-id-source: derived
  /xBonds/ListBondTypes:
    get:
      tags:
      - XigniteBonds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BondTypeList'
            text/json:
              schema:
                $ref: '#/components/schemas/BondTypeList'
            application/xml:
              schema:
                $ref: '#/components/schemas/BondTypeList'
            text/xml:
              schema:
                $ref: '#/components/schemas/BondTypeList'
            text/csv:
              schema:
                $ref: '#/components/schemas/BondTypeList'
      summary: Get x bonds list bond types
      x-summary-source: derived
      operationId: getXBondsListBondTypes
      x-operation-id-source: derived
  /xBonds/GetLastSale:
    get:
      tags:
      - XigniteBonds
      parameters:
      - name: Identifier
        in: query
        schema:
          type: string
      - name: IdentifierType
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/IdentifierTypes'
      - name: PriceSource
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/PriceSources'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastSale'
            text/json:
              schema:
                $ref: '#/components/schemas/LastSale'
            application/xml:
              schema:
                $ref: '#/components/schemas/LastSale'
            text/xml:
              schema:
                $ref: '#/components/schemas/LastSale'
            text/csv:
              schema:
                $ref: '#/components/schemas/LastSale'
      summary: Get x bonds get last sale
      x-summary-source: derived
      operationId: getXBondsGetLastSale
      x-operation-id-source: derived
  /xBonds/GetLastSales:
    get:
      tags:
      - XigniteBonds
      parameters:
      - name: Identifiers
        in: query
        schema:
          type: string
      - name: IdentifierType
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/IdentifierTypes'
      - name: PriceSource
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/PriceSources'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastSale'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastSale'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastSale'
            text/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastSale'
            text/csv:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LastSale'
      summary: Get x bonds get last sales
      x-summary-source: derived
      operationId: getXBondsGetLastSales
      x-operation-id-source: derived
