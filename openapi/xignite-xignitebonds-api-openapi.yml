components:
  schemas:
    BondType:
      type: object
      properties:
        Code:
          type:
          - string
          - 'null'
        Type:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
      additionalProperties: false
    PriceSources:
      enum:
      - FINRA
      type: string
    IdentifierTypes:
      enum:
      - Symbol
      - CIK
      - CUSIP
      - ISIN
      - Valoren
      - SEDOL
      - FIGI
      - CompositeFIGI
      type: string
    OutcomeTypes:
      enum:
      - Success
      - SystemError
      - RequestError
      - RegistrationError
      type: string
    DailyOpenHighLowClosePrice:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          InstrumentIdentifierBrief:
            allOf:
            - $ref: '#/components/schemas/InstrumentIdentifierBrief'
          DailyOpenHighLowClose:
            allOf:
            - $ref: '#/components/schemas/DailyOpenHighLowClose'
          Identifier:
            type:
            - string
            - 'null'
          IdentifierType:
            type:
            - string
            - 'null'
        additionalProperties: false
    ListBondsResult:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          BondType:
            type:
            - string
            - 'null'
          StartSymbol:
            type:
            - string
            - 'null'
          EndSymbol:
            type:
            - string
            - 'null'
          Securities:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/BondResult'
        additionalProperties: false
    Common:
      type: object
      properties:
        Delay:
          type: number
          format: double
        Identity:
          type:
          - string
          - 'null'
        Message:
          type:
          - string
          - 'null'
        Outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeTypes'
      additionalProperties: false
    InstrumentIdentifierBrief:
      type: object
      properties:
        Valoren:
          type:
          - string
          - 'null'
        CUSIP:
          type:
          - string
          - 'null'
        ISIN:
          type:
          - string
          - 'null'
      additionalProperties: false
    TradedPrice:
      type: object
      properties:
        ShortName:
          type:
          - string
          - 'null'
        Symbol:
          type:
          - string
          - 'null'
        PriceSource:
          type:
          - string
          - 'null'
        Currency:
          type:
          - string
          - 'null'
        LastSale:
          type: number
          format: double
        LastSaleDate:
          type:
          - string
          - 'null'
        LastSaleTime:
          type:
          - string
          - 'null'
        LastSaleSize:
          type: integer
          format: int32
        DailyOpen:
          type: number
          format: double
        DailyOpenDate:
          type:
          - string
          - 'null'
        DailyOpenTime:
          type:
          - string
          - 'null'
        DailyHigh:
          type: number
          format: double
        DailyHighDate:
          type:
          - string
          - 'null'
        DailyHighTime:
          type:
          - string
          - 'null'
        DailyLow:
          type: number
          format: double
        DailyLowDate:
          type:
          - string
          - 'null'
        DailyLowTime:
          type:
          - string
          - 'null'
        YearlyHigh:
          type: number
          format: double
        YearlyHighDate:
          type:
          - string
          - 'null'
        YearlyLow:
          type: number
          format: double
        YearlyLowDate:
          type:
          - string
          - 'null'
        LastYearClose:
          type: number
          format: double
        LastYearCloseDate:
          type:
          - string
          - 'null'
        YieldToMaturity:
          type: number
          format: double
        PriceUsedForCalculations:
          type: number
          format: double
        PriceUsedForCalculationsDate:
          type:
          - string
          - 'null'
        PriceUsedForCalculationsTime:
          type:
          - string
          - 'null'
      additionalProperties: false
    BondTypeList:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          BondTypes:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/BondType'
        additionalProperties: false
    LastSale:
      allOf:
      - $ref: '#/components/schemas/Common'
      - type: object
        properties:
          InstrumentIdentifierBrief:
            allOf:
            - $ref: '#/components/schemas/InstrumentIdentifierBrief'
          BondLastSale:
            allOf:
            - $ref: '#/components/schemas/BondLastSale'
          Identifier:
            type:
            - string
            - 'null'
          IdentifierType:
            type:
            - string
            - 'null'
        additionalProperties: false
    DailyOpenHighLowClose:
      type: object
