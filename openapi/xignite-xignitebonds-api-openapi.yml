          format: double
        DailyLowDate:
          type:
          - string
          - 'null'
        DailyLowTime:
          type:
          - string
          - 'null'
        DailyClose:
          type: number
          format: double
        DailyCloseDate:
          type:
          - string
          - 'null'
        DailyCloseTime:
          type:
          - string
          - 'null'
      additionalProperties: false
    BondLastSale:
